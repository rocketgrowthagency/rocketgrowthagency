<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- OG card RENDER template — screenshotted at 1200x630 by scripts/build-og-cards.mjs (Puppeteer/Chrome)
     to produce the per-page link-preview image. CSS is copied VERBATIM from the approved mockup
     (mockup-og-cards.html, .og / .maps blocks) so the output matches the mockup 100%. Inter is loaded
     the same way the live site loads it (Google Fonts), so the font is identical. Params via ?type=&name=&title=&win= -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --text-900:#0f1a3a; --text-700:#33466a; --primary:#2457e6; --green:#16a34a; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}

  .og{width:1200px;height:630px;background:
      radial-gradient(1100px 520px at 80% -10%, #eaf1ff 0%, rgba(234,241,255,0) 60%),
      linear-gradient(180deg,#ffffff 0%,#f4f8ff 100%);
    padding:70px 78px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .og-logo{display:flex;align-items:center;gap:18px}
  .og-ico{width:70px;height:70px;border-radius:18px;background:linear-gradient(160deg,#3b6cf0,#2457e6);
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(36,87,230,.34)}
  .og-word{font-size:40px;font-weight:800;letter-spacing:-0.02em;color:var(--text-900)}
  .og-word .b{color:var(--primary)}
  .og-pill{display:inline-flex;align-items:center;gap:11px;background:#eef2fb;color:#3a4d75;
    font-size:23px;font-weight:700;padding:11px 22px;border-radius:999px;align-self:flex-start}
  .og-dot{width:13px;height:13px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.16)}
  .og-h{font-size:82px;font-weight:900;letter-spacing:-0.03em;line-height:1.0;color:var(--text-900);margin:0}
  .og-h.sm{font-size:58px}
  .og-h .b{color:var(--primary)}
  .og-sub{font-size:29px;line-height:1.34;color:var(--text-700);max-width:610px;margin:20px 0 0;font-weight:500}
  .og-foot{display:flex;align-items:center;justify-content:space-between}
  .og-dom{font-size:26px;font-weight:800;color:var(--text-900)}
  .og-checks{display:flex;gap:26px}
  .og-chk{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:600;color:var(--text-700)}
  .og-chk svg{width:22px;height:22px;color:var(--green)}
  .og-mid{max-width:640px}

  .maps{position:absolute;right:78px;top:150px;width:392px;background:#fff;border-radius:20px;
    box-shadow:0 20px 50px rgba(20,40,90,.18);padding:22px 22px 24px;border:1px solid #eef1f7}
  .maps-hd{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:#5a6c90;margin-bottom:16px}
  .maps-hd svg{width:22px;height:22px;color:#2457e6}
  .m-row{display:flex;align-items:center;gap:14px;border-radius:13px;padding:14px 15px;margin-bottom:11px}
  .m-row.win{background:var(--primary)}
  .m-row.dim{background:#f1f4fa}
  .m-num{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;flex:none}
  .win .m-num{background:#fff;color:var(--primary)}
  .dim .m-num{background:#e2e8f4;color:#8a99b8}
  .m-body{display:flex;flex-direction:column;gap:6px;flex:1}
  .win .m-name{color:#fff;font-weight:800;font-size:20px}
  .win .m-meta{color:#dbe6ff;font-size:15px;font-weight:600}
  .m-bar{height:11px;border-radius:6px;background:#dde4f0}
  .m-bar.s{width:62%}
</style>
</head>
<body>
<div id="root"></div>
<script>
const PIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/></svg>';
const CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ROCKET = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>';
const STARS = '<span style="color:#ffd24a;font-size:18px;letter-spacing:1px">★★★★★</span>';
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function mapsPanel(win){
  return '<div class="maps"><div class="maps-hd">'+PIN+'Google Maps</div>'
    + '<div class="m-row win"><div class="m-num">1</div><div class="m-body"><div class="m-name">'+esc(win)+'</div><div class="m-meta">'+STARS+' · Open now</div></div></div>'
    + '<div class="m-row dim"><div class="m-num">2</div><div class="m-body"><div class="m-bar"></div><div class="m-bar s"></div></div></div>'
    + '<div class="m-row dim"><div class="m-num">3</div><div class="m-body"><div class="m-bar"></div><div class="m-bar s"></div></div></div></div>';
}
function ogCard({pill, h, accent, sub, win, small}){
  return '<div class="og">'
    + '<div class="og-logo"><div class="og-ico">'+ROCKET+'</div><div class="og-word">Rocket<span class="b">Growth</span>Agency</div></div>'
    + '<div class="og-pill"><span class="og-dot"></span>'+esc(pill)+'</div>'
    + '<div class="og-mid"><div class="og-h'+(small?' sm':'')+'">'+esc(h)+(accent?' <span class="b">'+esc(accent)+'</span>':'')+'</div><div class="og-sub">'+esc(sub)+'</div></div>'
    + '<div class="og-foot"><div class="og-dom">rocketgrowthagency.com</div>'
    + '<div class="og-checks"><div class="og-chk">'+CHK+'Free Growth Audit</div><div class="og-chk">'+CHK+'Month-to-month</div></div></div>'
    + mapsPanel(win) + '</div>';
}
// Tailored copy for the high-intent marketing pages (approved 2026-07-10). Home stays on the flagship
// og-image.jpg; utility pages (faq/contact/legal) keep the shared card — not tailored.
const MARK = {
  pricing:  {pill:'Google Maps Local SEO · Pricing',     h:'Local SEO pricing,',    accent:'half off month 1.', sub:'Month-to-month. $625/mo after your first month — cancel anytime.'},
  process:  {pill:'Google Maps Local SEO · Our Process', h:'How we get you in the',  accent:'Map Pack.',         sub:'Four systems working together to move you into the Google Maps top 3.'},
  services: {pill:'Google Maps Local SEO · Services',    h:'Everything we do to',    accent:'rank you.',         sub:'GBP optimization, local content, citations & reviews — the full Map-Pack playbook.'},
  fga:      {pill:'Free Growth Audit',                   h:'See exactly where you',  accent:'rank.',             sub:'A free, personalized Google Maps audit — where you stand and what’s holding you back.'},
};

// Copy templates — identical logic to the mockup; keeps headlines short + name-led so any length fits.
function build(p){
  const type = p.get('type') || 'industry';
  const win = p.get('win') || 'Your Business';
  if (MARK[type]){
    const m = MARK[type];
    return ogCard({pill:m.pill, h:m.h, accent:m.accent, sub:m.sub, win, small:(m.h+' '+m.accent).length>26});
  }
  if (type === 'blog'){
    let t = (p.get('title') || 'Local SEO, explained').trim();
    if (t.length > 42) t = t.slice(0,40).replace(/\s+\S*$/,'') + '…';
    return ogCard({pill:'RGA Blog · Local SEO', h:t, accent:'', sub:'Practical local-SEO tactics to rank in the Google Maps top 3.', win, small:t.length>22});
  }
  if (type === 'hub'){
    return ogCard({pill:'Google Maps Local SEO', h:'Every local industry we', accent:'rank.', sub:'Dentists, lawyers, contractors, home services & more — into the Google Maps top 3.', win});
  }
  const n = (p.get('name') || 'Local business').trim();
  const h = n + ' in the';
  return ogCard({pill:'Google Maps Local SEO · '+n, h, accent:'Map Pack.',
    sub:'We rank '+n.toLowerCase()+' into the Google Maps top 3 — turning local searches into calls.', win, small:(h+' Map Pack.').length>26});
}
document.getElementById('root').innerHTML = build(new URLSearchParams(location.search));
document.title = 'og-ready';
</script>
</body>
</html>
